# Banco local igual ao da AWS (PostgreSQL 16). Uso: docker compose up -d
services:
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    ports: ["5432:5432"]
    volumes: ["banco:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 5s
volumes:
  banco:
